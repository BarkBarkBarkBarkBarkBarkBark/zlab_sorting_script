[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sorting-scripts"
version = "0.1.0"
description = "Z-Lab Intan spike sorting and curation helpers"
readme = "readme.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "spikeinterface[full]==0.103.0",
    "probeinterface==0.3.2",
    "numpy>=1.26,<3",
    "pandas>=2.1,<3",
    "matplotlib>=3.8,<4",
]

[project.optional-dependencies]
gui = [
    "spikeinterface-gui[web]==0.11.0",
    "panel>=1.6,<2",
    "param>=2.1,<3",
    "jupyter_bokeh>=4,<5",
]
notebook = ["ipykernel>=6,<8", "jupyterlab>=4,<5", "ipywidgets>=8,<9"]
sorter = ["kilosort==4.1.1"]
# Match the training environment declared by the currently documented models.
# Changing sklearn can break serialized estimators.
unitrefine = ["scikit-learn==1.4.2", "numpy>=1.26,<2"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
